[project]
name = "fusealign"
version = "0.1.0"
description = "FuseAlign: forced alignment in the wild (PyTorch reimplementation)"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "torchaudio>=2.4",
    "numpy>=1.26",
    "soundfile>=0.12",
    "tqdm>=4.66",
    "tensorboard>=2.17",
]

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fusealign"]
